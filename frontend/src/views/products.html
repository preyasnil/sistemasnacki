<section class="products-page">
    <div class="products-heading">
        <div>
            <h2>Productos</h2>
            <p>Inventario de productos registrados</p>
        </div>
        <button class="products-button" id="refreshProducts" type="button">Actualizar lista</button>
    </div>
    <div class="products-card">
        <div class="products-table-wrapper">
            <table class="products-table">
                <thead>
                    <tr>
                        <th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">ID</th>
                        <th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Código de barras</th>
                        <th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Descripción</th>
                        <th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Stock</th>
                        <th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Precio unitario</th>
                        <th class="text-center px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Fecha de registro</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody">
                    <!-- Las filas se generarán dinámicamente con JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</section>
