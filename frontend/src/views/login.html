<div class="login-container">
    <!-- Panel Izquierdo: Diseño de Imagen / Identidad de marca -->
    <div class="login-visual">
        <div class="avatar-icon"></div>
        <h3>Control Operativo</h3>
        <p>Accede de forma segura al catálogo centralizado e inventario de productos.</p>
    </div>

    <!-- Panel Derecho: Formulario de Entrada -->
    <div class="login-form-section">
        <h2>Verificación de Personal</h2>
        <p class="subtitle">Por favor, introduce las credenciales asignadas.</p>
        
        <form id="form-registro">
            <div class="form-group">
                <label for="id_empleado">ID de Empleado</label>
                <input type="text" id="id_empleado" required placeholder="Ej. EMP-2026">
            </div>

            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" required placeholder="Ej. Carlos Mendoza">
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="carlos@sistema.com">
            </div>

            <button type="submit" class="btn-submit">Ingresar al Inventario</button>
        </form>
    </div>
</div>
